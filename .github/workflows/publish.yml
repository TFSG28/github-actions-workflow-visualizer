name: Publish to Open VSX

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify grammar
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies -o gh-actions-viewer.vsix

      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          # create-namespace is a one-time op; ignore the error if it already exists.
          npx --yes ovsx create-namespace TFSG28 -p "$OVSX_TOKEN" || true
          npx --yes ovsx publish gh-actions-viewer.vsix -p "$OVSX_TOKEN"
